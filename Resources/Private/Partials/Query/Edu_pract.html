<f:if condition="{result}">
    <f:then>
        <div class="result_table">
            <table border="1">
                <thead>
                    <tr>
                        <th>Адрес места нахождения</th>
                        <th>Наименование оборудованного учебного кабинета</th>
                        <th>Оснащенность оборудованного учебного кабинета</th>
                        <th>Приспособленность для использования инвалидами и лицами с ограниченными возможностями здоровья</th>
                       </tr>
                </thead>
                <f:for each="{result}" as="result">
                    <tbody>
                        <tr itemprop="purposePrac">
                            <td itemprop="addressPrac">{result.address}</td>
                            <td itemprop="namePrac">{result.name}</td>
                            <td itemprop="osnPrac">{result.equipment}</td>
                            <td itemprop="ovzPrac">{result.ovz}</td>    
                          </tr>
                    </tbody>
                </f:for>
            </table>
        </div>
    </f:then>
    <f:else>
        <p>Данных нет</p>
    </f:else>
</f:if>
